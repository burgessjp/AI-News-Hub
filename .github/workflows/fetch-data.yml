name: Fetch Hub Data

# 每天北京时间 18:17 抓一次「Hub」tab 浏览区域的 8 个数据源,解析成
# JSON 后提交到 gitcode 数据仓库的 news-hub-data 分支。
#
# cron 用 UTC:北京 18:17 = UTC 10:17。
#
# 刻意避开整点分钟:GitHub 对 schedule 事件的排队延迟在整点(尤其 10:00 UTC
# 全球高峰窗口)最重——cron 曾配 '0 10 * * *',2026-09 实测连续 28 天实际触发
# 迟 3~8 小时,晚班落到北京 21:00~次日 01:50;非整点分钟负载显著更低。
# cron 仍不保证准点,脚本内部按 TZ=Asia/Shanghai 取「真正执行时」的北京时间
# 生成文件名日期/时间,因此即便延迟到 18:40 才跑,目录名仍是当天的 18-40,不会错位。
#
# 18 点档对 Product Hunt 无时机约束:「Product of the Day」每天 PT 00:01(夏令时
# UTC 07:01/北京 15:01,冬令时 UTC 08:01/北京 16:01)上线,北京 18:17(UTC 10:17)
# 跑时当日榜单已上线 3 小时以上。postedAfter 恒用 PT 当日 0 点(见
# scripts/sources/producthunt.py 的 _ph_today_pt_start,勿改回 UTC 边界——北京 08:00 批
# = UTC 00:00 整会拿空)。
#
# 失败策略(对齐 scripts/fetch_data.py):单源失败 3 次重试后被跳过,成功源照常提交;
# 失败源的 index.json latest 指针从上一次 index.json 继承,客户端永远拿到有效数据。
# 全部失败时 fetch 步骤退出码非 0,workflow 标红便于发现。
#
# 流程由 scripts/pipeline.sh 统一编排(抓取 + AI 总结 + 推送);本 workflow 只负责
# 环境准备(装依赖)与注入 secrets。4 个环境变量在 pipeline.sh 执行前
# 统一检测(需求 b-i):AI_NEWS_HUB_AI_BASE_URL / _MODEL / _API_KEY / GITCODE_TOKEN。

on:
  schedule:
    - cron: '17 10 * * *'  # UTC 10:17 = 北京 18:17(避开整点分钟,防 GitHub schedule 排队数小时;PH 当日榜单已上线 3h+)
  workflow_dispatch:       # 支持手动触发,便于首次验证 / 临时补抓

# 定时与手动撞车时排队而非双双失败(push 非快进会报错丢本轮)
concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 50   # 25(抓取+AI+推送)+ 语音速报硬上限 20 分钟(阶段墙钟预算,超时告警跳过)+ 冷缓存自举/推送余量
    env:
      TZ: Asia/Shanghai    # 脚本据此把文件名日期/时间统一成北京时间
      # 语音速报临时禁产(v1.4.0 移除 App 端语音播放):tts_broadcast.py 整阶段跳过,
      # 恢复时删掉此行即可;引擎/缓存链路原样保留
      AI_NEWS_HUB_TTS_DISABLE: "1"
      # qwentts.cpp 代码 pin(语音速报):与 scripts/tts_broadcast.py 的
      # DEFAULT_QWENTTS_REF 同源;actions/cache 的 key 绑定它,升级引擎改这里 +
      # 脚本常量两处同步(缓存自动换 key 重新拉取/构建)
      QWENTTS_REF: a8a7716b530e49fed537c57711247c12fbbb903c

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # 语音速报引擎(qwentts.cpp / Qwen3-TTS GGUF)零 Python 依赖:代码克隆 +
      # cmake 构建 + GGUF 下载全部由 scripts/tts_broadcast.py 按需自举。这里只
      # 缓存整个 third_party/tts-engine(源码 + build 二进制 + ≈1.2GB GGUF),
      # key 绑 pin SHA:同 SHA 秒回,升 SHA 换 key 全量重建;脚本按「二进制 /
      # GGUF 文件级判在位」补齐缓存缺失部分,不存在 MOSS 方案的目录级陷阱。
      # 构建需 cmake + g++(ubuntu runner 预装);GGUF 从 huggingface.co 直连
      # (runner 在境外,主源即成功;脚本内置 hf-mirror 兜底供本地中国网络用)。
      - name: Cache TTS engine (qwentts.cpp + GGUF models)
        uses: actions/cache@v4
        with:
          path: third_party/tts-engine
          key: qwentts-${{ env.QWENTTS_REF }}

      - name: Run pipeline (fetch + AI summary + push)
        env:
          AI_NEWS_HUB_AI_BASE_URL: ${{ secrets.AI_NEWS_HUB_AI_BASE_URL }}
          AI_NEWS_HUB_AI_MODEL: ${{ secrets.AI_NEWS_HUB_AI_MODEL }}
          AI_NEWS_HUB_AI_API_KEY: ${{ secrets.AI_NEWS_HUB_AI_API_KEY }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          # Product Hunt Developer Token(可选源:缺失时 producthunt 源失败跳过,
          # 其余 5 源照常)。去 https://api.producthunt.com/v2/dashboard 拿。
          PRODUCT_HUNT_KEY: ${{ secrets.PRODUCT_HUNT_KEY }}
        run: bash scripts/pipeline.sh
