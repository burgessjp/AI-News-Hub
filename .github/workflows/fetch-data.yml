name: Fetch Hub Data

# 每天北京时间 15:30 抓一次「Hub」tab 浏览区域的 8 个数据源,解析成
# JSON 后提交到 gitcode 数据仓库的 news-hub-data 分支。
#
# cron 用 UTC:北京 15:30 = UTC 07:30。
#
# GitHub cron 不保证准点,脚本内部按 TZ=Asia/Shanghai 取「真正执行时」的北京时间
# 生成文件名日期/时间,因此即便延迟到 15:45 才跑,目录名仍是当天的 15-45,不会错位。
#
# 选 15:30 而非 12:00:Product Hunt 的「Product of the Day」每天 UTC 07:01
# (北京 15:01)上线,北京 15:30(UTC 07:30)跑时 PH API 日级聚合已能返回当日批次
# (见 scripts/fetch_data.py 的 _ph_posted_after);定在 12:00(UTC 04:00)会拿空。
#
# 失败策略(对齐 scripts/fetch_data.py):单源失败 3 次重试后被跳过,成功源照常提交;
# 失败源的 index.json latest 指针从上一次 index.json 继承,客户端永远拿到有效数据。
# 全部失败时 fetch 步骤退出码非 0,workflow 标红便于发现。
# 注:LinuxDo 套 Cloudflare 强挑战,普通 HTTP 库被秒拦,这里用 Playwright
# 真 Chromium 过 CF(见下方 install 步骤)。runner 的数据中心 IP 仍可能被 CF
# 额外收紧 → LinuxDo 单源失败属已知风险,会被跳过,其余 4 源照常。
#
# 流程由 scripts/pipeline.sh 统一编排(抓取 + AI 总结 + 推送);本 workflow 只负责
# 环境准备(装依赖 / playwright)与注入 secrets。4 个环境变量在 pipeline.sh 执行前
# 统一检测(需求 b-i):AI_NEWS_HUB_AI_BASE_URL / _MODEL / _API_KEY / GITCODE_TOKEN。

on:
  schedule:
    - cron: '30 7 * * *'   # UTC 07:30 = 北京 15:30(PH 当日批次 07:01 上线,日级聚合已覆盖)
  workflow_dispatch:       # 支持手动触发,便于首次验证 / 临时补抓

# 定时与手动撞车时排队而非双双失败(push 非快进会报错丢本轮)
concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Shanghai    # 脚本据此把文件名日期/时间统一成北京时间

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Cache Playwright browsers
        # 浏览器二进制(~150MB)单独缓存,不随 pip cache;key 随依赖声明变化
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium(供 LinuxDo 过 Cloudflare)
        # linux.do 套 CF 强挑战,普通 requests/curl_cffi 都被拦,必须真 Chromium。
        # --with-deps 装 Chromium 跑 headless 需要的系统库(libnss3/libatk 等)。
        # --shell 后单独跑:playwright 的浏览器(~150MB)单独缓存,不在 pip cache 里。
        run: python -m playwright install --with-deps chromium

      - name: Run pipeline (fetch + AI summary + push)
        env:
          AI_NEWS_HUB_AI_BASE_URL: ${{ secrets.AI_NEWS_HUB_AI_BASE_URL }}
          AI_NEWS_HUB_AI_MODEL: ${{ secrets.AI_NEWS_HUB_AI_MODEL }}
          AI_NEWS_HUB_AI_API_KEY: ${{ secrets.AI_NEWS_HUB_AI_API_KEY }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          # Product Hunt Developer Token(可选源:缺失时 producthunt 源失败跳过,
          # 其余 5 源照常)。去 https://api.producthunt.com/v2/dashboard 拿。
          PRODUCT_HUNT_KEY: ${{ secrets.PRODUCT_HUNT_KEY }}
        run: bash scripts/pipeline.sh
