name: Fetch Hub Data

# 每天北京时间 15:30 抓一次「Hub」tab 浏览区域的 8 个数据源,解析成
# JSON 后提交到 gitcode 数据仓库的 news-hub-data 分支。
#
# cron 用 UTC:北京 15:30 = UTC 07:30。
#
# GitHub cron 不保证准点,脚本内部按 TZ=Asia/Shanghai 取「真正执行时」的北京时间
# 生成文件名日期/时间,因此即便延迟到 15:45 才跑,目录名仍是当天的 15-45,不会错位。
#
# 选 15:30 而非 12:00:Product Hunt 的「Product of the Day」每天 PT 00:01(夏令时
# UTC 07:01/北京 15:01,冬令时 UTC 08:01/北京 16:01)上线,北京 15:30(UTC 07:30)
# 跑时 PH API 日级聚合已能返回当日批次(见 scripts/fetch_data.py 的
# _ph_today_pt_start);定在 12:00(UTC 04:00)会拿空。postedAfter 恒用 PT 当日
# 0 点——冬令时下 UTC 边界连本批也会拿空(当前 PT 日批次 08:01 才上线)。
#
# 失败策略(对齐 scripts/fetch_data.py):单源失败 3 次重试后被跳过,成功源照常提交;
# 失败源的 index.json latest 指针从上一次 index.json 继承,客户端永远拿到有效数据。
# 全部失败时 fetch 步骤退出码非 0,workflow 标红便于发现。
#
# 流程由 scripts/pipeline.sh 统一编排(抓取 + AI 总结 + 推送);本 workflow 只负责
# 环境准备(装依赖)与注入 secrets。4 个环境变量在 pipeline.sh 执行前
# 统一检测(需求 b-i):AI_NEWS_HUB_AI_BASE_URL / _MODEL / _API_KEY / GITCODE_TOKEN。

on:
  schedule:
    - cron: '30 7 * * *'   # UTC 07:30 = 北京 15:30(PH 当日批次 07:01 上线,日级聚合已覆盖)
  workflow_dispatch:       # 支持手动触发,便于首次验证 / 临时补抓

# 定时与手动撞车时排队而非双双失败(push 非快进会报错丢本轮)
concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 35   # 25(抓取+AI+推送)+ 语音速报合成(11 条 2-6 分钟)+ 首次模型下载余量
    env:
      TZ: Asia/Shanghai    # 脚本据此把文件名日期/时间统一成北京时间
      # MOSS-TTS-Nano 代码 pin(语音速报):与 scripts/tts_broadcast.py 的
      # DEFAULT_MOSS_REF 同源;actions/cache 的 key 绑定它,升级模型改这里 +
      # 脚本常量两处同步(缓存自动换 key 重新拉取)
      MOSS_TTS_NANO_REF: cc7bdf19c7639c0870dab22045a33b442760f6be

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 钉 3.12:torch 2.7.0 / pynini 2.1.6.post1 的 manylinux wheel 均只到
          # cp313,'3.x' 漂移到 3.14 即无 wheel 可装,TTS 依赖步骤会整体失败
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            scripts/requirements.txt
            scripts/requirements-tts.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # 语音速报依赖:torch CPU / pynini→WeTextProcessing 的安装姿势有讲究,
      # 不能并进 requirements 文件(见 scripts/requirements-tts.txt 头注释)。
      # 顺序固定:pynini 先装(有 manylinux wheel),WeTextProcessing 后装且必须
      # --no-deps --no-build-isolation —— 顺序错会因构建隔离产出空包;
      # torch 只为满足 MOSS 模块顶层 import(内置音色路径不实际调用)。
      - name: Install TTS dependencies
        run: |
          pip install -r scripts/requirements-tts.txt
          pip install setuptools
          pip install torch==2.7.0 torchaudio==2.7.0 --index-url https://download.pytorch.org/whl/cpu
          pip install pynini==2.1.6.post1
          pip install --no-deps --no-build-isolation WeTextProcessing==1.0.4.1

      # 缓存整个克隆(代码 + 728MB 模型):不能只缓存 models/ 子目录 —— cache
      # 恢复会让 clone 目标目录非空,代码永远补不上。key 绑 pin SHA,同 SHA 秒回,
      # 升级换 key 全量重建(代码由 tts_broadcast.py 按需自举,模型首次初始化
      # 自动从 HuggingFace 下载,均无需本步骤处理)
      - name: Cache MOSS-TTS-Nano (code + models)
        uses: actions/cache@v4
        with:
          path: third_party/MOSS-TTS-Nano
          key: moss-tts-${{ env.MOSS_TTS_NANO_REF }}

      - name: Run pipeline (fetch + AI summary + push)
        env:
          AI_NEWS_HUB_AI_BASE_URL: ${{ secrets.AI_NEWS_HUB_AI_BASE_URL }}
          AI_NEWS_HUB_AI_MODEL: ${{ secrets.AI_NEWS_HUB_AI_MODEL }}
          AI_NEWS_HUB_AI_API_KEY: ${{ secrets.AI_NEWS_HUB_AI_API_KEY }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          # Product Hunt Developer Token(可选源:缺失时 producthunt 源失败跳过,
          # 其余 5 源照常)。去 https://api.producthunt.com/v2/dashboard 拿。
          PRODUCT_HUNT_KEY: ${{ secrets.PRODUCT_HUNT_KEY }}
        run: bash scripts/pipeline.sh
