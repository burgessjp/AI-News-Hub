name: Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.jks

      - name: Generate keystore.properties
        # heredoc 加引号:secret 值由 GitHub 先替换进脚本,密码含 $ / 反引号时
        # 不加引号会被 bash 二次展开,签名静默用错密码
        run: |
          cat > keystore.properties << 'EOF'
          storeFile=app/release.jks
          storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Inject version from tag
        # versionName = tag 去 v 前缀;versionCode 从 x.y.z 换算(x*10000+y*100+z),
        # tag 非语义化版本时回退 run_number(单调递增即可)
        run: |
          VN="${GITHUB_REF_NAME#v}"
          if [[ "$VN" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IFS='.' read -r MA MI PA <<< "$VN"
            VC=$((MA * 10000 + MI * 100 + PA))
          else
            VC=${{ github.run_number }}
          fi
          echo "version_name=$VN" >> "$GITHUB_ENV"
          echo "version_code=$VC" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease -PversionName="$version_name" -PversionCode="$version_code"

      - name: Get version name
        id: version
        run: echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
